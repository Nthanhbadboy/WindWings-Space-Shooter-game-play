name: Recover pinned initial-scene SpriteRenderer graph
on:
  push:
    paths: ['tools/recovery/scene_sprite_renderers.py', '.github/workflows/recover-scene-sprites.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: scene-sprites-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/apk/windwings.xapk
          key: windwings-xapk-1.3.118-f5d3c7a188dce663a1f06961380da0d6ffa541138d7cb957215e884cdd057c7e
          fail-on-cache-miss: true
      - run: python3 -m pip install 'UnityPy==1.25.4' 'Pillow==12.0.0'
      - name: Recover built-in scene renderers and ancestor chains
        run: python3 tools/recovery/scene_sprite_renderers.py --xapk /tmp/apk/windwings.xapk --work /tmp/scene-sprites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-sprites-evidence
          path: reverse-engineering/raw/scene-sprites/
      - run: python3 -m unittest discover -s tests -q
      - name: Preserve scoped raw including explicit exceptions
        if: ${{ !cancelled() }}
        run: |
          test "$GITHUB_REF_NAME" = 'arena/ef6b75ef-windwings-space-shooter-game-p'
          test -f reverse-engineering/raw/scene-sprites/index.json
          git config user.name 'Arena evidence collector'
          git config user.email 'agent@arena.ai'
          git add reverse-engineering/raw/scene-sprites
          git diff --cached --quiet || git commit -m 'research(sprites): preserve initial-scene renderer graph [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase --autostash -X theirs origin arena/ef6b75ef-windwings-space-shooter-game-p
            if git push origin arena/ef6b75ef-windwings-space-shooter-game-p; then exit 0; fi
          done
          exit 1
