name: Recover ef6b75ef board-power107 evidence
on:
  push:
    paths: ['tools/recovery/board_power107.py', '.github/workflows/recover-board-power107.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: l3-board-power107-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/apk/windwings.xapk
          key: windwings-xapk-1.3.118-f5d3c7a188dce663a1f06961380da0d6ffa541138d7cb957215e884cdd057c7e
          fail-on-cache-miss: true
      - run: git pull --ff-only origin arena/ef6b75ef-windwings-space-shooter-game-p
      - run: python3 tools/recovery/board_power107.py --xapk /tmp/apk/windwings.xapk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l3-board-power107-evidence
          path: reverse-engineering/raw/board-power107
      - name: Preserve pinned graph
        run: |
          test "$GITHUB_REF_NAME" = 'arena/ef6b75ef-windwings-space-shooter-game-p'
          test -f reverse-engineering/raw/board-power107/cells.json
          git config user.name 'Arena evidence collector'
          git config user.email 'agent@arena.ai'
          git add reverse-engineering/raw/board-power107
          git diff --cached --quiet || git commit -m 'Preserve pinned board-power107 bilinear neighborhoods [skip ci]'
          git pull --rebase --autostash origin arena/ef6b75ef-windwings-space-shooter-game-p
          git push origin arena/ef6b75ef-windwings-space-shooter-game-p
