name: Recover exact early wave prefabs
on:
  push:
    paths: ['.github/workflows/recover-early-waves.yml', 'tools/apk-analyze/early_wave_prefabs.py']
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/apk/windwings.xapk
          key: windwings-xapk-1.3.118-f5d3c7a188dce663a1f06961380da0d6ffa541138d7cb957215e884cdd057c7e
          fail-on-cache-miss: true
      - name: Extract pinned original inputs
        run: |
          python3 - <<'PY'
          import hashlib,io,zipfile
          from pathlib import Path
          p=Path('/tmp/apk/windwings.xapk')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='f5d3c7a188dce663a1f06961380da0d6ffa541138d7cb957215e884cdd057c7e'
          dest=Path('/tmp/apk/extract');dest.mkdir(parents=True,exist_ok=True)
          wanted={'assets/bin/Data/data.unity3d','assets/bin/Data/Managed/Metadata/global-metadata.dat','lib/arm64-v8a/libil2cpp.so'}
          with zipfile.ZipFile(p) as outer:
              for name in outer.namelist():
                  if not name.endswith('.apk'):continue
                  with zipfile.ZipFile(io.BytesIO(outer.read(name))) as apk:
                      for source in wanted.intersection(apk.namelist()):
                          (dest/Path(source).name).write_bytes(apk.read(source))
          assert all((dest/Path(s).name).exists() for s in wanted)
          PY
      - run: pip install -q 'UnityPy==1.25.4' 'TypeTreeGeneratorAPI==0.0.10'
      - run: python3 tools/apk-analyze/early_wave_prefabs.py
      - name: Preserve evidence without APK or original assets
        run: |
          git config user.name 'Arena evidence collector'
          git config user.email 'agent@arena.ai'
          git add reverse-engineering/raw/early-waves
          git diff --cached --quiet || git commit -m 'research(waves): preserve exact container prefab identities and raw components [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
