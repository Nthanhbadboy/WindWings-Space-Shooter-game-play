name: Windows x86_64 export (launch slice)

# Builds game/ from this branch: the M1-M4 prototype plus the M2 launch-slice
# scenes, data and headless rule tests. Godot and the official templates are
# downloaded only on the runner. A green build is not a Windows runtime claim.
#
# Three animation variants build side by side, because the art package is being
# delivered as three candidates the USER will run and choose between:
#   A  generated clean layers        (layered animation)
#   B  inpainted flat image, layered (layered animation)
#   C  one flat image per sprite     (whole-image animation)
# Each job rewrites game/data/animation_variant.json before import, so every
# .exe knows its own variant, folder and animation mode.
on:
  workflow_dispatch:
    inputs:
      art_package_commit:
        description: "Commit of the delivered art package (empty = placeholder build)"
        required: false
        default: ""
  push:
    branches:
      - arena/5a03a450-windwings-space-shooter-game-p

permissions:
  contents: write

jobs:
  export:
    name: Windows x86_64 ANIM-${{ matrix.variant }}, embedded PCK, headless tests
    if: github.ref == 'refs/heads/arena/5a03a450-windwings-space-shooter-game-p'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B, C]
    env:
      GODOT_TAG: 4.7.2-stable
      GODOT_TEMPLATE_VERSION: 4.7.2.stable
      GODOT_LINUX_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
      GODOT_TEMPLATES_SHA256: f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011
      SOURCE_COMMIT: 77744f31a3b499770375ea44410f26c314b08995
      ANIM_VARIANT: ${{ matrix.variant }}
      ART_PACKAGE_COMMIT: ${{ inputs.art_package_commit }}
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select the animation variant for this build
        shell: bash
        run: |
          set -euo pipefail
          commit="${ART_PACKAGE_COMMIT:-}"
          if [ -n "$commit" ]; then
            source_flag=package
          else
            source_flag=placeholder
            echo "No art package commit supplied: this build is a PLACEHOLDER build."
          fi
          python3 "$GITHUB_WORKSPACE/game/tools/build_variant.py" \
            --variant "$ANIM_VARIANT" \
            --art-source "$source_flag" \
            --art-package-commit "$commit"
          cat "$GITHUB_WORKSPACE/game/data/animation_variant.json"
          python3 "$GITHUB_WORKSPACE/game/tools/build_variant.py" \
            --variant "$ANIM_VARIANT" \
            --art-source "$source_flag" \
            --art-package-commit "$commit" \
            --check

      - name: Install pinned Godot and the Windows export template
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          exec > >(tee -a "$GITHUB_WORKSPACE/dist/export.log") 2>&1
          set -euo pipefail

          test -f "$GITHUB_WORKSPACE/game/project.godot"
          echo "Ancestor prototype commit (M1-M4 base): $SOURCE_COMMIT"
          echo "Build commit: $GITHUB_SHA"
          echo "Downloading official Godot assets on the GitHub runner."

          cache="$RUNNER_TEMP/godot-4.7.2"
          template_dir="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATE_VERSION"
          mkdir -p "$cache" "$template_dir"
          engine="$cache/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          templates="$cache/Godot_v${GODOT_TAG}_export_templates.tpz"
          base="https://github.com/godotengine/godot/releases/download/$GODOT_TAG"

          curl --fail --location --silent --show-error --retry 3 \
            --output "$engine" "$base/$(basename "$engine")"
          printf '%s  %s\n' "$GODOT_LINUX_SHA256" "$engine" | sha256sum --check
          unzip -q "$engine" -d "$cache"
          godot="$cache/Godot_v${GODOT_TAG}_linux.x86_64"
          chmod +x "$godot"
          version="$("$godot" --version)"
          echo "Godot version: $version"
          case "$version" in
            4.7.2.stable.official*) ;;
            *) echo "Unexpected Godot version: $version" >&2; exit 1 ;;
          esac

          curl --fail --location --silent --show-error --retry 3 \
            --output "$templates" "$base/$(basename "$templates")"
          printf '%s  %s\n' "$GODOT_TEMPLATES_SHA256" "$templates" | sha256sum --check
          template_version="$(unzip -p "$templates" templates/version.txt | tr -d '\r\n')"
          echo "Export templates version: $template_version"
          test "$template_version" = "$GODOT_TEMPLATE_VERSION"
          unzip -q -j "$templates" templates/windows_release_x86_64.exe -d "$template_dir"
          test -s "$template_dir/windows_release_x86_64.exe"
          rm -f "$templates" "$engine"
          echo "GODOT_BIN=$godot" >> "$GITHUB_ENV"

      - name: Import, test and export the launch slice
        id: export
        shell: bash
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/dist/export.log") 2>&1
          set -euo pipefail

          project="$GITHUB_WORKSPACE/game"
          out="$GITHUB_WORKSPACE/dist"
          # Include JSON because the prototype opens its data files via FileAccess.
          # Resource editing is intentionally disabled for this unsigned Linux CI
          # cross-export: an icon/company identity and a Windows editor are not
          # provided. This is not an MSIX or a store-ready signed binary.
          cat > "$project/export_presets.cfg" <<'PRESET'
          [preset.0]
          name="Windows Desktop"
          platform="Windows Desktop"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter="*.json"
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          debug/export_console_wrapper=0
          binary_format/embed_pck=true
          binary_format/architecture="x86_64"
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=false
          codesign/enable=false
          application/modify_resources=false
          PRESET
          cp "$project/export_presets.cfg" "$out/export_presets.cfg"

          echo "Re-generating the art slot contract and checking it is committed"
          python3 "$GITHUB_WORKSPACE/game/tools/build_art_slot_contract.py"
          if ! git -C "$GITHUB_WORKSPACE" diff --exit-code -- \
               game/data/art_slot_contract.json game/data/ART_SLOT_CONTRACT.md; then
            echo "Art slot contract is stale; re-run game/tools/build_art_slot_contract.py." >&2
            exit 1
          fi

          echo "Importing source project with Godot $GODOT_TAG"
          "$GODOT_BIN" --headless --path "$project" --editor --import 2>&1 \
            | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E '(^|[[:space:]])(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/godot-import.log"; then
            echo "Godot reported an import/script error; refusing a green build." >&2
            exit 1
          fi

          echo "Running headless rule tests"
          set +e
          "$GODOT_BIN" --headless --path "$project" --script res://tests/run_tests.gd \
            2>&1 | tee "$RUNNER_TEMP/godot-tests.log"
          test_status=${PIPESTATUS[0]}
          set -e
          cp "$RUNNER_TEMP/godot-tests.log" "$out/tests.log"
          if [ "$test_status" -ne 0 ] || ! grep -q '^TESTS_OK$' "$RUNNER_TEMP/godot-tests.log"; then
            echo "Headless rule tests failed (status $test_status)." >&2
            exit 1
          fi
          # Runtime-triggered script errors count as a failure even when the
          # runner exits 0, because they would ship a broken slice.
          if grep -E '(^|[[:space:]])SCRIPT ERROR:' "$RUNNER_TEMP/godot-tests.log"; then
            echo "Godot reported a script error during the tests." >&2
            exit 1
          fi

          echo "Smoke-running the menu scene headless (120 frames)"
          set +e
          "$GODOT_BIN" --headless --path "$project" --quit-after 120 \
            2>&1 | tee -a "$out/smoke.log"
          menu_status=${PIPESTATUS[0]}
          set -e
          echo "Smoke-running the run scene headless (900 frames)"
          set +e
          "$GODOT_BIN" --headless --path "$project" res://scenes/main.tscn --quit-after 900 \
            2>&1 | tee -a "$out/smoke.log"
          run_status=${PIPESTATUS[0]}
          set -e
          if [ "$menu_status" -ne 0 ] || [ "$run_status" -ne 0 ]; then
            echo "Headless smoke run failed (menu=$menu_status run=$run_status)." >&2
            exit 1
          fi
          if grep -E 'SCRIPT ERROR:' "$out/smoke.log"; then
            echo "Godot reported a script error during the smoke run." >&2
            exit 1
          fi
          if ! grep -q 'SLICE_MENU_READY' "$out/smoke.log"; then
            echo "The menu scene did not report SLICE_MENU_READY." >&2
            exit 1
          fi
          if ! grep -q 'SLICE_RUN_START' "$out/smoke.log"; then
            echo "The run scene did not report SLICE_RUN_START." >&2
            exit 1
          fi

          echo "Headless full-run harness (5 waves -> boss -> victory -> save)"
          set +e
          "$GODOT_BIN" --headless --path "$project" --quit-after 5400 \
            res://scenes/main.tscn -- --slice-autoplay 2>&1 | tee -a "$out/smoke.log"
          harness_status=${PIPESTATUS[0]}
          set -e
          if [ "$harness_status" -ne 0 ]; then
            echo "Full-run harness failed (status $harness_status)." >&2
            exit 1
          fi
          if ! grep -q 'SLICE_RUN_END victory=true' "$out/smoke.log"; then
            echo "Full-run harness did not reach a victory." >&2
            exit 1
          fi
          clears="$(grep -c 'SLICE_WAVE_CLEAR' "$out/smoke.log" || true)"
          if [ "$clears" -ne 5 ]; then
            echo "Full-run harness cleared $clears waves, expected 5." >&2
            exit 1
          fi
          if ! grep -qE 'SLICE_RUN_END victory=true .*stars=3' "$out/smoke.log"; then
            echo "A full clear must save three stars." >&2
            exit 1
          fi

          echo "Collecting art slot status"
          set +e
          "$GODOT_BIN" --headless --path "$project" --script res://tools/art_report.gd \
            2>&1 | tee "$out/art_report.log"
          art_status=${PIPESTATUS[0]}
          set -e
          if [ "$art_status" -ne 0 ]; then
            echo "Art slot report failed (status $art_status)." >&2
            exit 1
          fi
          if ! grep -q '^ART_SUMMARY total=' "$out/art_report.log"; then
            echo "Art slot report produced no summary line." >&2
            exit 1
          fi
          if ! grep -q '^ART_REPORT_END$' "$out/art_report.log"; then
            echo "Art slot report did not finish." >&2
            exit 1
          fi
          if grep -E '(^|[[:space:]])SCRIPT ERROR:' "$out/art_report.log"; then
            echo "The art slot report hit a script error." >&2
            exit 1
          fi
          if ! grep -q "^ANIM_VARIANT variant=${ANIM_VARIANT} " "$out/art_report.log"; then
            echo "The art report did not describe variant ${ANIM_VARIANT}." >&2
            exit 1
          fi
          if ! grep -q "^ART_CONTRACT slots=.* art_root=res://art/${ANIM_VARIANT}$" "$out/art_report.log"; then
            echo "The art report did not load variant folder art/${ANIM_VARIANT}." >&2
            exit 1
          fi
          echo "Art slot status: $(grep '^ART_SUMMARY' "$out/art_report.log")"

          exe="$out/WindWings-anim-${ANIM_VARIANT}.exe"
          echo "Exporting Windows Desktop release with embedded PCK: $(basename "$exe")"
          "$GODOT_BIN" --headless --path "$project" --export-release \
            "Windows Desktop" "$exe" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          if grep -E '(^|[[:space:]])(SCRIPT ERROR|ERROR):' "$RUNNER_TEMP/godot-export.log"; then
            echo "Godot reported an export/script error; refusing a green build." >&2
            exit 1
          fi
          test -s "$exe"
          if find "$out" -maxdepth 1 -type f -name '*.pck' -print -quit | grep -q .; then
            echo "Unexpected separate PCK; embedded single-executable contract failed." >&2
            exit 1
          fi

          # Verify the PE machine and Godot's actual `pck` section, rather than
          # merely trusting the preset or a zero exit status from the exporter.
          python3 - "$exe" <<'PY'
          import struct
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          size = path.stat().st_size
          with path.open("rb") as f:
              dos = f.read(64)
              if len(dos) != 64 or dos[:2] != b"MZ":
                  raise SystemExit("Not a DOS/PE executable")
              pe = struct.unpack_from("<I", dos, 0x3C)[0]
              f.seek(pe)
              if f.read(4) != b"PE\0\0":
                  raise SystemExit("Invalid PE signature")
              coff = f.read(20)
              if len(coff) != 20:
                  raise SystemExit("Truncated PE/COFF header")
              machine, count, _, _, _, optional_size, _ = struct.unpack("<HHIIIHH", coff)
              if machine != 0x8664:
                  raise SystemExit(f"Unexpected PE machine: 0x{machine:04x}")
              optional = f.read(optional_size)
              if len(optional) < 2 or struct.unpack_from("<H", optional)[0] != 0x20B:
                  raise SystemExit("Expected PE32+ optional header")
              found = None
              for _ in range(count):
                  section = f.read(40)
                  if len(section) != 40:
                      raise SystemExit("Truncated PE section table")
                  name = section[:8].split(b"\0", 1)[0]
                  raw_size, raw_offset = struct.unpack_from("<II", section, 16)
                  if name == b"pck":
                      found = (raw_offset, raw_size)
              if found is None:
                  raise SystemExit("Godot pck PE section not found")
              offset, length = found
              if length < 16 or offset + length > size:
                  raise SystemExit("Invalid embedded PCK section bounds")
              f.seek(offset)
              prefix = f.read(min(length, 16))
              if b"GDPC" not in prefix:
                  raise SystemExit("Embedded PCK header magic not found")
              f.seek(offset + length - 4)
              if f.read(4) != b"GDPC":
                  raise SystemExit("Embedded PCK footer magic not found")
              f.seek(offset)
              pck = f.read(length)
              expected = (
                  b"data/launch_slice_waves.json",
                  b"data/boss_slice.json",
                  b"data/save_contract.json",
                  b"data/art_slot_contract.json",
                  b"data/animation_variant.json",
                  b"data/player_start_stats.json",
                  b"scenes/menu.tscn",
                  b"scenes/main.tscn",
                  b"scenes/boss.tscn",
                  b"tests/run_tests.gd",
              )
              for data_path in expected:
                  if data_path not in pck:
                      raise SystemExit(f"Expected source data absent from PCK: {data_path!r}")
              print(f"PE32+ x86_64; embedded PCK offset={offset}, size={length}; source data present")
          PY

          variant_line="$(grep '^ANIM_VARIANT ' "$out/art_report.log" | head -1)"
          if grep -q '^ANIM_VARIANT_PLACEHOLDER ' "$out/art_report.log"; then
            placeholder_line="ART_SOURCE placeholder: no ${ANIM_VARIANT} art package has been delivered yet, this build runs the variant rules on fallback art"
          else
            placeholder_line="ART_SOURCE package: delivered ${ANIM_VARIANT} art package"
          fi
          cat > "$out/BUILD_INFO.txt" <<INFO
          Godot: $GODOT_TAG
          Animation variant: ANIM-$ANIM_VARIANT ($variant_line)
          Art folder: res://art/$ANIM_VARIANT (then user://art/$ANIM_VARIANT, res://art, user://art)
          Art package commit: ${ART_PACKAGE_COMMIT:-none}
          $placeholder_line
          Ancestor prototype commit (M1-M4 base): $SOURCE_COMMIT
          Workflow commit: $GITHUB_SHA
          GitHub run: $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)
          Target: Windows Desktop x86_64, embedded PCK
          Windows runtime: RUNTIME_UNVERIFIED for this slice build
          Headless rule tests: see tests.log (TESTS_OK required for this artifact)
          Headless smoke run: see smoke.log (menu, run scene, full 5-wave harness)
          Art slots: contract res://data/art_slot_contract.json, root res://art/$ANIM_VARIANT (fallback = vector shape)
          Resource editing: disabled; no icon or company identity provided
          Signing and MSIX: not performed (USER-ONLY)
          Scope: M2 launch slice - menu, ship select, 5 real waves, boss, results,
                 pause, audio settings, save/load. Not full 282-wave parity.
          INFO
          {
            echo ""
            echo "--- Art slot status (res://art/$ANIM_VARIANT first, then user://art/$ANIM_VARIANT, res://art, user://art) ---"
            grep -E '^(ART_|ANIM_VARIANT)' "$out/art_report.log" || true
          } >> "$out/BUILD_INFO.txt"
          (cd "$out" && sha256sum "$(basename "$exe")" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          exe_sha="$(cut -d ' ' -f 1 "$out/SHA256SUMS.txt")"
          echo "exe_sha256=$exe_sha" >> "$GITHUB_OUTPUT"
          echo "::notice title=WindWings.exe SHA-256::$exe_sha"

      - name: Upload executable and evidence
        uses: actions/upload-artifact@v4
        with:
          name: WindWings-anim-${{ matrix.variant }}-run-${{ github.run_id }}-sha256-${{ steps.export.outputs.exe_sha256 }}
          path: |
            dist/WindWings-anim-${{ matrix.variant }}.exe
            dist/SHA256SUMS.txt
            dist/export.log
            dist/export_presets.cfg
            dist/BUILD_INFO.txt
            dist/tests.log
            dist/smoke.log
            dist/art_report.log
          if-no-files-found: error
          retention-days: 14

      - name: Render motion frames (xvfb + software GL)
        shell: bash
        if: success()
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/dist/motion.log") 2>&1
          set -euo pipefail
          project="$GITHUB_WORKSPACE/game"
          out="$GITHUB_WORKSPACE/dist"

          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
          python3 -m pip install --quiet --disable-pip-version-check pillow

          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run -a -s "-screen 0 1280x1024x24" "$GODOT_BIN" --path "$project" \
            --rendering-driver opengl3 --audio-driver Dummy --fixed-fps 60 \
            --resolution 288x512 res://tools/motion_capture.tscn \
            -- --out="$out/frames" --capture-fps=12

          if grep -E '(^|[[:space:]])SCRIPT ERROR:' "$out/motion.log"; then
            echo "A script error occurred while capturing motion frames." >&2
            exit 1
          fi
          grep '^MOTION_SEGMENT' "$out/motion.log"
          python3 "$project/tools/build_motion_gifs.py" \
            --frames "$out/frames" --out "$GITHUB_WORKSPACE/motion/$ANIM_VARIANT" --fps 12 \
            | tee -a "$out/motion.log"
          segments="$(grep -c '^MOTION_GIF' "$out/motion.log" || true)"
          if [ "$segments" -lt 3 ]; then
            echo "Expected 3 motion segments, captured $segments." >&2
            exit 1
          fi
          ls -l "$GITHUB_WORKSPACE/motion/$ANIM_VARIANT"

      - name: Publish motion evidence to the branch
        shell: bash
        # Only one matrix job pushes; A carries the shared motion/README.
        if: success() && matrix.variant == 'A'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config user.name "windwings-ci"
          git config user.email "windwings-ci@users.noreply.github.com"
          git add motion
          if git diff --cached --quiet; then
            echo "Motion evidence unchanged."
            exit 0
          fi
          git commit -m "chore(motion): refresh animation frame evidence [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload motion evidence
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: motion-frames-anim-${{ matrix.variant }}-${{ github.run_id }}
          path: |
            motion
            dist/frames
            dist/motion.log
          if-no-files-found: error
          retention-days: 14

      - name: Ensure failure diagnostics exist
        if: failure()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          if [ ! -f "$GITHUB_WORKSPACE/dist/export.log" ]; then
            echo "The job failed before the export log was created; inspect the Actions job log." > "$GITHUB_WORKSPACE/dist/export.log"
          fi
          # Expose the tail as a check-run annotation as well as an artifact, so
          # failures can be diagnosed through the GitHub API if blob downloads
          # are unavailable from the sandbox.
          python3 - "$GITHUB_WORKSPACE/dist/export.log" <<'PY'
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          tail = "\n".join(lines[-60:])[-14000:]
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Windows export failure::" + escaped)
          PY

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-export-failure-anim-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/export.log
          if-no-files-found: error
          retention-days: 14
