name: Analyze WindWings APK

on:
  push:
    paths:
      - 'tools/apk-analyze/**'
      - '.github/workflows/analyze-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  XAPK_URL: https://d.apkpure.net/b/XAPK/com.Wind.wings.Space.Shooter?version=latest
  DOTNET_ROLL_FORWARD: LatestMajor

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore XAPK
        uses: actions/cache@v4
        with:
          path: /tmp/apk/windwings.xapk
          key: windwings-xapk-1.3.118-f5d3c7a188dce663a1f06961380da0d6ffa541138d7cb957215e884cdd057c7e

      - name: Fetch XAPK if cache missed
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk
          if [ ! -s /tmp/apk/windwings.xapk ]; then
            curl -fSL --retry 3 --retry-delay 5 -A 'Mozilla/5.0 Chrome/124' -o /tmp/apk/windwings.xapk "$XAPK_URL"
          fi
          sha256sum /tmp/apk/windwings.xapk

      - name: Extract Unity payload
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk/extract
          python3 - <<'PY'
          import zipfile, os
          x = zipfile.ZipFile('/tmp/apk/windwings.xapk')
          os.makedirs('/tmp/apk/parts', exist_ok=True)
          for n in x.namelist():
              if n.endswith('.apk'):
                  with x.open(n) as s, open('/tmp/apk/parts/' + os.path.basename(n), 'wb') as d:
                      while True:
                          b = s.read(1 << 20)
                          if not b: break
                          d.write(b)
          base = '/tmp/apk/parts/com.Wind.wings.Space.Shooter.apk'
          config = '/tmp/apk/parts/config.arm64_v8a.apk'
          with zipfile.ZipFile(base) as z:
              for n in ['assets/bin/Data/data.unity3d',
                        'assets/bin/Data/Managed/Metadata/global-metadata.dat',
                        'assets/bin/Data/ScriptingAssemblies.json',
                        'assets/bin/Data/RuntimeInitializeOnLoads.json',
                        'assets/bin/Data/globalgamemanagers',
                        'assets/bin/Data/globalgamemanagers.assets',
                        'assets/bin/Data/resources.resource',
                        'resources.arsc']:
                  try:
                      out = '/tmp/apk/extract/' + os.path.basename(n)
                      with z.open(n) as s, open(out, 'wb') as d:
                          d.write(s.read())
                      print('extracted', n, os.path.getsize(out))
                  except KeyError:
                      print('missing', n)
          with zipfile.ZipFile(config) as z:
              for n in ['lib/arm64-v8a/libil2cpp.so', 'lib/arm64-v8a/libunity.so']:
                  out = '/tmp/apk/extract/' + os.path.basename(n)
                  with z.open(n) as s, open(out, 'wb') as d:
                      d.write(s.read())
                  print('extracted', n, os.path.getsize(out))
          PY
          ls -l /tmp/apk/extract

      - name: Unity version + engine strings
        continue-on-error: true
        run: |
          set +e
          {
            echo "## Unity version candidates"
            strings -n 6 /tmp/apk/extract/libunity.so | grep -E '^20[0-9]{2}\.[0-9]+\.[0-9]+[abfp][0-9]+' | sort -u | head -20
            echo "--- data.unity3d ---"
            strings -n 6 /tmp/apk/extract/data.unity3d | grep -E '^20[0-9]{2}\.[0-9]+\.[0-9]+[abfp][0-9]+' | sort -u | head -20
            echo "--- metadata ---"
            xxd -l 32 /tmp/apk/extract/global-metadata.dat
          } | tee /tmp/apk/unity_version.txt
          echo "## ScriptingAssemblies.json"
          cat /tmp/apk/extract/ScriptingAssemblies.json | tee -a /tmp/apk/unity_version.txt
          echo "## RuntimeInitializeOnLoads.json"
          head -c 4000 /tmp/apk/extract/RuntimeInitializeOnLoads.json | tee -a /tmp/apk/unity_version.txt

      - name: Download Il2CppDumper
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/tools/il2cppdumper
          curl -fSL --retry 3 -o /tmp/tools/il2cppdumper.zip \
            https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net7-v6.7.46.zip
          unzip -o -q /tmp/tools/il2cppdumper.zip -d /tmp/tools/il2cppdumper
          ls -la /tmp/tools/il2cppdumper | head -20
          dotnet --info | head -20

      - name: Run Il2CppDumper
        continue-on-error: true
        run: |
          set -o pipefail
          cd /tmp/tools/il2cppdumper
          DOTNET=$(ls Il2CppDumper.dll 2>/dev/null || ls *.dll | head -1)
          echo "entry: $DOTNET"
          mkdir -p /tmp/apk/il2cpp
          dotnet "$DOTNET" /tmp/apk/extract/libil2cpp.so /tmp/apk/extract/global-metadata.dat /tmp/apk/il2cpp 2>&1 | tail -60 | tee /tmp/apk/il2cpp/run.log
          ls -la /tmp/apk/il2cpp | head -30

      - name: IL2CPP report
        continue-on-error: true
        run: |
          if [ -f /tmp/apk/il2cpp/dump.cs ]; then
            python3 tools/apk-analyze/il2cpp_report.py
          else
            echo "no dump.cs" > /tmp/apk/il2cpp_report_error.txt
          fi

      - name: Install UnityPy
        continue-on-error: true
        run: pip install --quiet "UnityPy==1.25.4"

      - name: Unity asset probe
        continue-on-error: true
        run: |
          mkdir -p /tmp/apk/unity
          python3 tools/apk-analyze/unity_assets.py probe 2>&1 | tail -40
          python3 tools/apk-analyze/unity_assets.py text 2>&1 | tail -20

      - name: Export Unity assets (textures/sprites/audio/fonts)
        continue-on-error: true
        run: python3 tools/apk-analyze/unity_assets.py export 2>&1 | tail -30

      - name: Build REA (mytechnotalent/rea) and analyze APK
        continue-on-error: true
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/mytechnotalent/rea /tmp/rea
          cd /tmp/rea
          cargo build --release 2>&1 | tail -30
          ls -l target/release/rea
          cd /tmp/apk
          /tmp/rea/target/release/rea analyze /tmp/apk/parts/com.Wind.wings.Space.Shooter.apk 2>&1 | tail -60 | tee /tmp/apk/rea.log
          ls -la /tmp/apk | grep -i re- || true

      - name: Assemble reports
        if: always()
        run: |
          set -euo pipefail
          mkdir -p docs/apk-analysis reverse-engineering/il2cpp reverse-engineering/textassets
          cp /tmp/apk/unity_version.txt docs/apk-analysis/02-unity-engine.md || true
          if [ -f /tmp/apk/il2cpp_report/il2cpp-report.md ]; then
            cp /tmp/apk/il2cpp_report/il2cpp-report.md docs/apk-analysis/03-il2cpp.md
            cp /tmp/apk/il2cpp_report/strings.json docs/apk-analysis/03-il2cpp-strings.json || true
            cp /tmp/apk/il2cpp_report/interesting-classes.cs reverse-engineering/il2cpp/interesting-classes.cs || true
            SZ=$(stat -c%s /tmp/apk/il2cpp_report/class-index.json 2>/dev/null || echo 0)
            if [ "$SZ" -lt 12000000 ]; then cp /tmp/apk/il2cpp_report/class-index.json reverse-engineering/il2cpp/class-index.json; fi
            if [ -f /tmp/apk/il2cpp/dump.cs ]; then
              gzip -9 -c /tmp/apk/il2cpp/dump.cs > reverse-engineering/il2cpp/dump.cs.gz
              SZ2=$(stat -c%s reverse-engineering/il2cpp/dump.cs.gz)
              if [ "$SZ2" -gt 30000000 ]; then rm -f reverse-engineering/il2cpp/dump.cs.gz; fi
            fi
            ls -la /tmp/apk/il2cpp > docs/apk-analysis/03-il2cpp-files.txt || true
            { echo; echo '```'; cat /tmp/apk/il2cpp/run.log 2>/dev/null | tail -40; echo '```'; } >> docs/apk-analysis/03-il2cpp.md
          else
            echo "IL2CPP dump failed or was skipped." > docs/apk-analysis/03-il2cpp.md
            cat /tmp/apk/il2cpp/run.log 2>/dev/null >> docs/apk-analysis/03-il2cpp.md || true
          fi
          if [ -f /tmp/apk/unity/probe.md ]; then
            cp /tmp/apk/unity/probe.md docs/apk-analysis/04-unity-assets.md
          fi
          if [ -f /tmp/apk/unity/export.md ]; then
            cat /tmp/apk/unity/export.md >> docs/apk-analysis/04-unity-assets.md
          fi
          if [ -d /tmp/apk/unity/textassets ] && [ "$(du -sb /tmp/apk/unity/textassets | cut -f1)" -lt 25000000 ]; then
            cp -r /tmp/apk/unity/textassets/. reverse-engineering/textassets/ 2>/dev/null || true
          fi
          if [ -f /tmp/apk/re-suspect.md ]; then
            python3 - <<'PY'
          import re
          s = open('/tmp/apk/re-suspect.md', encoding='utf-8', errors='replace').read()
          s = re.sub(r'AIza[0-9A-Za-z_-]{35}', 'AIza_REDACTED', s)
          s = re.sub(r'(?i)(api[_-]?key["\s:=]+)[0-9A-Za-z_-]{16,}', r'\1REDACTED', s)
          s = re.sub(r'[0-9a-fA-F]{40,}', 'HEX_REDACTED', s)
          open('docs/apk-analysis/05-rea.md','w').write(s)
          PY
            ls -l /tmp/apk/re-suspect.json 2>/dev/null && cp /tmp/apk/re-suspect.json docs/apk-analysis/05-rea.json || true
            cat /tmp/apk/rea.log >> docs/apk-analysis/05-rea.md 2>/dev/null || true
          else
            echo "REA report not produced." > docs/apk-analysis/05-rea.md
            cat /tmp/apk/rea.log 2>/dev/null >> docs/apk-analysis/05-rea.md || true
          fi
          du -sh docs/apk-analysis reverse-engineering 2>/dev/null || true

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windwings-analysis
          path: |
            /tmp/apk/il2cpp/dump.cs
            /tmp/apk/il2cpp/DummyDll
            /tmp/apk/il2cpp/stringliteral.json
            /tmp/apk/il2cpp/script.json
            /tmp/apk/il2cpp/il2cpp.h
            /tmp/apk/extract/ScriptingAssemblies.json
            /tmp/apk/extract/RuntimeInitializeOnLoads.json
            /tmp/apk/unity/probe.json
            /tmp/apk/unity/probe.md
            /tmp/apk/unity/textassets
            /tmp/apk/unity/export
            /tmp/apk/re-suspect.md
            /tmp/apk/re-suspect.json
            /tmp/apk/rea.log
            /tmp/apk/il2cpp/run.log
          retention-days: 30

      - name: Commit reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs reverse-engineering
          git diff --cached --quiet || git commit -m "chore(re): IL2CPP + Unity + REA analysis reports [skip ci]"
          git pull --rebase --autostash || true
          git push
