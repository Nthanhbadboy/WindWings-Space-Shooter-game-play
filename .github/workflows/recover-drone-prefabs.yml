name: Recover pinned drone prefab bindings
on:
  push:
    paths: ['tools/recovery/drone_prefabs.py', '.github/workflows/recover-drone-prefabs.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/apk/windwings.xapk
          key: windwings-xapk-1.3.118-f5d3c7a188dce663a1f06961380da0d6ffa541138d7cb957215e884cdd057c7e
          fail-on-cache-miss: true
      - run: python3 -m pip install 'UnityPy==1.25.4' 'TypeTreeGeneratorAPI==0.0.10'
      - run: python3 tools/recovery/drone_prefabs.py --xapk /tmp/apk/windwings.xapk --output reverse-engineering/raw/drone-prefabs
      - name: Preserve scoped prefab evidence
        run: |
          test "$GITHUB_REF_NAME" = 'arena/ef6b75ef-windwings-space-shooter-game-p'
          git config user.name 'Arena evidence collector'
          git config user.email 'agent@arena.ai'
          git add reverse-engineering/raw/drone-prefabs
          git diff --cached --quiet || git commit -m 'Preserve pinned serialized drone identity and hierarchy [skip ci]'
          git pull --rebase --autostash origin arena/ef6b75ef-windwings-space-shooter-game-p
          git push origin arena/ef6b75ef-windwings-space-shooter-game-p
