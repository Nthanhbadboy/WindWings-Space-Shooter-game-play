name: runtime-probe

# Boots a cloud Android device with Ramus, installs the build, and inspects the
# game from inside the process (embedded C# bridge) plus screenshots/UI tree.
#
# APK SOURCE — the repo already ships one as a DRAFT release asset:
#   tag:   windwings-apk-1.3.118   asset: windwings.xapk (142.125.649 B)
# It is an XAPK (zip), not a plain APK, so `prepare-apk.sh` unpacks base.apk
# and any config splits before Ramus sees it.
#
# CREDENTIALS — none required: `ramus trial` mints a 15-minute anonymous key.
# The trial has no adb tunnel, so the bridge is read through `RAMUSB|` logcat
# mirrors. Adding RAMUS_API_KEY upgrades the same job to the HTTP path.
#
# CI does not patch or modify the APK; it only installs what the repo already has.

on:
  workflow_dispatch:
    inputs:
      apk_source:
        description: 'APK/XAPK path, https URL, or release:<tag>. Empty → auto-detect from this repo'
        required: false
        type: string
      scenario:
        description: 'Label written into the report'
        required: false
        default: anonymous
        type: string
      taps:
        description: 'Space-separated normalized taps, e.g. "0.5,0.8 0.5,0.8"'
        required: false
        default: ''
        type: string
      wait_scene:
        description: 'Block until this scene name is active (HTTP path only)'
        required: false
        default: ''
        type: string
      statics:
        description: 'Comma-separated game types to dump via /statics (key mode only)'
        required: false
        default: 'Stage_Datas,Player_Get_Datas,Enemy_Get_Datas,Stage_Get_Datas'
        type: string
      strict:
        description: 'Fail the job when the bridge produced no data at all'
        required: false
        default: true
        type: boolean
      force_trial:
        description: 'Anonymous trial even when RAMUS_API_KEY exists (tests the no-adb path)'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: runtime-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  RAMUS_CLI: ramus-cli@0.1.17
  RAMUS_PACKAGE: com.wind.wings.Space.Shooter
  PROBE_OUT: reports/runtime-probe
  TRIAL_APK_MAX_MB: '150'

jobs:
  preflight:
    name: preflight (APK + mode)
    runs-on: ubuntu-latest
    # contents:write is only used to READ the draft release asset (GitHub hides
    # drafts from read-only tokens). Fork PRs always run read-only, so they fall
    # back to the "no APK" skip instead of going red.
    permissions:
      contents: write
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      mode: ${{ steps.gate.outputs.mode }}
      source: ${{ steps.gate.outputs.source }}
    steps:
      - uses: actions/checkout@v4

      - name: Secret leak guard
        run: |
          set -euo pipefail
          # A Ramus key looks like rms_<base62>. It must never live in the repo.
          if git grep -nE 'rms_[A-Za-z0-9_-]{20,}' -- .; then
            echo "::error::A Ramus API key is committed to this repository. Revoke it at ramus.dev/settings and purge it from history."
            exit 1
          fi
          echo "no key material in the tree"

      - id: gate
        env:
          KEY: ${{ secrets.RAMUS_API_KEY }}
          INPUT_SOURCE: ${{ inputs.apk_source }}
          VAR_SOURCE: ${{ vars.RAMUS_APK_SOURCE }}
          FORCE_TRIAL: ${{ inputs.force_trial }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # ── which APK ──
          src="${INPUT_SOURCE:-${VAR_SOURCE:-}}"

          if [ -z "$src" ]; then
            if [ -f "runtime-probe/app.apk" ]; then
              src="runtime-probe/app.apk"
            elif [ -f "runtime-probe/app.xapk" ]; then
              src="runtime-probe/app.xapk"
            else
              # Auto-detect a release in this repo that actually carries an APK/XAPK asset.
              # (gh release list prints: TITLE <tab> TYPE <tab> TAG <tab> DATE, drafts included)
              while IFS=$'\t' read -r _title _type tag _date; do
                [ -n "${tag:-}" ] || continue
                if gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null \
                     | grep -qiE '\.(apk|xapk|apks)$'; then
                  src="release:$tag"
                  break
                fi
              done < <(gh release list --limit 15 2>/dev/null || true)
              [ -n "$src" ] && echo "auto-detected $src"
            fi
          fi

          if [ -z "$src" ]; then
            echo "::notice::No APK source (input apk_source / variable RAMUS_APK_SOURCE / runtime-probe/app.apk / an *apk* release)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "source=$src" >> "$GITHUB_OUTPUT"
          echo "APK source: $src"

          # ── which credential ──
          if [ -n "${KEY:-}" ] && [ "${FORCE_TRIAL:-false}" != "true" ]; then
            echo "mode=key" >> "$GITHUB_OUTPUT"
            echo "::notice::RAMUS_API_KEY present → adb tunnel + HTTP bridge + /statics."
          else
            echo "mode=trial" >> "$GITHUB_OUTPUT"
            echo "::notice::Anonymous trial: 15-minute credential, 150 MB, one session, NO adb → logcat path only."
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

  probe:
    name: ramus device probe
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ needs.preflight.outputs.mode == 'key' && 45 || 25 }}
    permissions:
      contents: write      # read the draft release asset
      pull-requests: write # comment the report on a PR
    env:
      RAMUS_MODE: ${{ needs.preflight.outputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare APK (APK / XAPK / APKS)
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.preflight.outputs.source }}
        run: |
          set -euo pipefail
          mkdir -p "$PROBE_OUT"
          # Outputs of this same step are not readable inside it, so parse the log.
          .github/scripts/prepare-apk.sh --source "$SOURCE" --out .ci/apk | tee "$PROBE_OUT/apk-prepare.log"

          apk=$(sed -n 's/^apk=//p' "$PROBE_OUT/apk-prepare.log" | tail -1)
          splits=$(sed -n 's/^splits=//p' "$PROBE_OUT/apk-prepare.log" | tail -1)
          [ -f "$apk" ] || { echo "::error::prepare-apk.sh did not produce $apk"; exit 1; }

          {
            echo "RAMUS_APK=$apk"
            echo "APK_SPLITS=$splits"
          } >> "$GITHUB_ENV"
          echo "RAMUS_APK=$apk   splits: ${splits:-none}"

      - name: Check APK against the trial limit
        env:
          BASE_MB: ${{ steps.apk.outputs.base_mb }}
          SPLITS: ${{ steps.apk.outputs.splits }}
        run: |
          set -euo pipefail
          ls -lh .ci/apk/base.apk
          sha256sum .ci/apk/base.apk | tee apk.sha256

          if [ "$RAMUS_MODE" = "trial" ] && [ "$BASE_MB" -gt "$TRIAL_APK_MAX_MB" ]; then
            echo "::error::base.apk is ${BASE_MB} MB — the anonymous trial accepts ${TRIAL_APK_MAX_MB} MB."
            echo "::error::Add RAMUS_API_KEY, or point apk_source at a smaller split."
            exit 1
          fi
          if [ -n "$SPLITS" ] && [ "$RAMUS_MODE" = "trial" ]; then
            echo "::warning::This source has config splits, and a trial session has no adb to install them."
            echo "::warning::Base-only install may crash on a missing native library — see apk-inventory.txt."
          fi

      - name: Credentials
        env:
          KEY: ${{ secrets.RAMUS_API_KEY }}
        run: |
          set -euo pipefail
          if [ "$RAMUS_MODE" = "key" ]; then
            echo "RAMUS_API_KEY=$KEY" >> "$GITHUB_ENV"
            echo "signed-in key mode" > "$PROBE_OUT/auth.txt"
          else
            # Mint as late as possible: the credential only lives 15 minutes.
            npx --yes "$RAMUS_CLI" trial --force | tee "$PROBE_OUT/trial.json"
            exp=$(jq -r '.expiresAt // empty' "$PROBE_OUT/trial.json" 2>/dev/null || true)
            jq -c '.limits // {}' "$PROBE_OUT/trial.json" 2>/dev/null >> "$PROBE_OUT/auth.txt" || true
            echo "RAMUS_TRIAL_EXPIRES=$exp" >> "$GITHUB_ENV"
            if [ -n "$exp" ]; then
              echo "RAMUS_DEADLINE=$(date -u -d "$exp" +%s)" >> "$GITHUB_ENV"
              echo "::notice::trial credential valid until $exp"
            fi
          fi

      - name: Validate key
        if: env.RAMUS_MODE == 'key'
        run: |
          set -euo pipefail
          if ! npx --yes "$RAMUS_CLI" status | tee "$PROBE_OUT/status.json"; then
            echo "::error::RAMUS_API_KEY was rejected. Rotate it at ramus.dev/settings and re-set the secret:"
            echo "::error::  gh secret set RAMUS_API_KEY"
            exit 1
          fi

      - name: Start session
        id: session
        run: |
          set -euo pipefail
          started=0
          for i in 1 2 3; do
            echo "── session start, attempt $i/3 ──"
            if npx --yes "$RAMUS_CLI" session start \
                 --apk "$RAMUS_APK" \
                 --wait \
                 --timeout 600 \
                 | tee "$PROBE_OUT/session.json"; then
              started=1
              break
            fi
            cat "$PROBE_OUT/session.json" 2>/dev/null || true
            if [ "$i" -lt 3 ]; then sleep 20; fi
          done

          if [ "$started" -ne 1 ]; then
            echo "::error::Ramus refused to start a session three times — see session.json in the artefact."
            jq -r '.error // .message // empty' "$PROBE_OUT/session.json" 2>/dev/null || true
            exit 1
          fi

          sid=$(jq -r '.sessionId // .session_id // .id // .session.id // .session.sessionId // empty' \
                "$PROBE_OUT/session.json" 2>/dev/null || true)
          if [ -n "$sid" ]; then
            echo "RAMUS_SESSION=$sid" >> "$GITHUB_ENV"
            echo "session=$sid" >> "$GITHUB_OUTPUT"
            echo "session id: $sid"
          else
            echo "::notice::Could not parse a session id; the CLI will use the last session."
          fi
          npx --yes "$RAMUS_CLI" session list || true

      - name: Wait for the app
        run: |
          set -euo pipefail
          npx --yes "$RAMUS_CLI" wait --stable --timeout 60000 || true
          npx --yes "$RAMUS_CLI" screenshot --out "$PROBE_OUT/screen-boot.jpg" || true

      - name: Open adb tunnel (key mode only)
        id: adb
        if: env.RAMUS_MODE == 'key'
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! command -v adb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq android-tools-adb
          fi
          adb version
          out=$(npx --yes "$RAMUS_CLI" adb --port 5555 2>&1 || true)
          echo "$out"
          serial=$(printf '%s\n' "$out" | grep -oE '(emulator-[0-9]+|[0-9]{1,3}(\.[0-9]{1,3}){3}:[0-9]+)' | head -1 || true)
          if [ -z "$serial" ]; then
            adb devices
            serial=$(adb devices | awk 'NR>1 && $2=="device" {print $1; exit}')
          fi
          echo "serial=$serial"
          test -n "$serial"
          echo "ADB_SERIAL=$serial" >> "$GITHUB_ENV"
          adb -s "$serial" forward tcp:8080 tcp:8080
          adb -s "$serial" shell pidof "$RAMUS_PACKAGE" || true
          curl -fsS --max-time 10 http://127.0.0.1:8080/health | tee "$PROBE_OUT/health-direct.json"

      - name: Install config splits (key mode, when the source is a bundle)
        if: env.RAMUS_MODE == 'key' && steps.apk.outputs.splits != ''
        continue-on-error: true
        env:
          SPLITS: ${{ steps.apk.outputs.splits }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          adb -s "$ADB_SERIAL" install-multiple -r -t .ci/apk/base.apk $SPLITS
          adb -s "$ADB_SERIAL" shell monkey -p "$RAMUS_PACKAGE" -c android.intent.category.LAUNCHER 1 || true
          sleep 5
          curl -fsS --max-time 10 http://127.0.0.1:8080/health | tee "$PROBE_OUT/health-after-splits.json" || true

      - name: Push OBB payload (key mode, when present)
        if: env.RAMUS_MODE == 'key' && hashFiles('.ci/apk/obb/**') != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          adb -s "$ADB_SERIAL" shell mkdir -p "/sdcard/Android/obb/$RAMUS_PACKAGE"
          adb -s "$ADB_SERIAL" push .ci/apk/obb/. "/sdcard/Android/obb/$RAMUS_PACKAGE/"

      - name: Skip adb (trial)
        if: env.RAMUS_MODE == 'trial'
        run: |
          echo "::notice::Trial sessions have no adb tunnel — the probe reads RAMUSB logcat mirrors instead."
          echo "no-adb (trial)" > "$PROBE_OUT/adb.txt"

      - name: Scenario taps
        if: github.event_name == 'workflow_dispatch' && inputs.taps != ''
        continue-on-error: true
        env:
          TAPS: ${{ inputs.taps }}
        run: |
          set -euo pipefail
          for tap in $TAPS; do
            echo "tap $tap"
            npx --yes "$RAMUS_CLI" tap "$tap" --force || true
            sleep 2
          done

      - name: Probe game state
        run: |
          set -euo pipefail
          budget=0
          if [ -n "${RAMUS_DEADLINE:-}" ]; then
            budget=$(( RAMUS_DEADLINE - $(date -u +%s) ))
            echo "trial budget left: ${budget}s"
          fi

          args=(--out "$PROBE_OUT" --label "${{ inputs.scenario || github.event_name }}" --mode "$RAMUS_MODE")
          if [ "$RAMUS_MODE" = "trial" ]; then
            args+=(--wait-server 5 --logcat-wait 90)
          else
            args+=(--wait-server 120 --logcat-wait 30)
            if [ -n "${{ inputs.wait_scene }}" ]; then args+=(--wait-scene "${{ inputs.wait_scene }}"); fi
            if [ -n "${{ inputs.statics }}" ]; then args+=(--statics "${{ inputs.statics }}"); fi
          fi
          if [ "$budget" -gt 0 ] && [ "$budget" -lt 600 ]; then args+=(--budget "$budget"); fi
          if [ "${{ inputs.strict }}" != "false" ]; then args+=(--strict); fi
          node .github/scripts/ramus-probe.mjs "${args[@]}"

      - name: Session watch link
        if: always() && env.RAMUS_SESSION != ''
        continue-on-error: true
        run: npx --yes "$RAMUS_CLI" session share | tee "$PROBE_OUT/watch-link.json"

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-probe-${{ github.run_id }}
          path: |
            ${{ env.PROBE_OUT }}
            apk.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f "$PROBE_OUT/report.md" ] || exit 0
          {
            echo "<!-- runtime-probe -->"
            cat "$PROBE_OUT/report.md"
          } > "$PROBE_OUT/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "$PROBE_OUT/comment.md" \
            --edit-last --create-if-none

      - name: End session
        if: always() && env.RAMUS_SESSION != ''
        continue-on-error: true
        run: npx --yes "$RAMUS_CLI" session end
