name: bridge-build

# Compiles runtime-probe/RamusBridge.cs for real, against the actual loader
# assemblies, and publishes the DLLs. Nothing here is simulated: a failed
# compile turns this job red.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runtime-probe/**'
      - '.github/workflows/bridge-build.yml'
      - '.github/scripts/build-bridge.sh'
  pull_request:
    paths:
      - 'runtime-probe/**'
      - '.github/workflows/bridge-build.yml'
      - '.github/scripts/build-bridge.sh'

# NOTE: no workflow-level `concurrency` here — a reusable workflow (workflow_call)
# that also declares concurrency makes the *caller* fail with startup_failure.
# The standalone run is deduped by the job-level group instead.
permissions:
  contents: read
  pull-requests: write

env:
  BEP6_TAG: v6.0.0-pre.2
  BEP5_TAG: v5.4.23.5
  MELON_TAG: v0.7.3

jobs:
  build:
    name: compile (core + 3 loaders)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Toolchain
        run: |
          exec > >(tee -a ci.log) 2>&1
          dotnet --info | head -20
          java -version 2>&1 | head -1 || true

      - name: Fetch loader assemblies
        run: |
          exec > >(tee -a ci.log) 2>&1
          chmod +x .github/scripts/fetch-loader-refs.sh
          .github/scripts/fetch-loader-refs.sh --refs .ci/refs

      - name: Compile all targets
        id: compile
        run: |
          exec > >(tee -a ci.log) 2>&1
          set -o pipefail
          chmod +x .github/scripts/build-bridge.sh
          .github/scripts/build-bridge.sh --out dist --refs .ci/refs 2>&1 | tee -a ci.log

      - name: Keep the log
        if: always()
        run: |
          mkdir -p dist
          cp ci.log dist/ci.log 2>/dev/null || true
          wc -l ci.log 2>/dev/null || echo "no ci.log produced"

      - name: Inventory the DLLs
        if: always()
        run: |
          set -euo pipefail
          {
            echo "# Bridge build"
            echo
            find dist -name 'RamusBridge.dll' -printf '%p  %s B\n' 2>/dev/null | sort || echo "no DLL produced"
          } | tee dist/inventory.txt
          # A real plugin must at least contain the bridge types.
          for d in $(find dist -name 'RamusBridge.dll'); do
            echo "── $d"
            if command -v strings >/dev/null; then
              strings -a "$d" | grep -cE 'Ramus\.Bridge|TcpListener|RAMUSB' || true
            fi
          done

      - name: Report failure on the PR
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "<!-- bridge-build -->"
            echo "## ❌ bridge build failed"
            echo
            echo '```'
            tail -80 ci.log 2>/dev/null || echo "no ci.log — job stopped before the first step"
            echo '```'
          } > comment.md
          chmod +x .github/scripts/pr-comment.sh
          .github/scripts/pr-comment.sh "${{ github.event.pull_request.number }}" \
            comment.md '<!-- bridge-build -->'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramus-bridge-dlls-${{ github.run_id }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14
