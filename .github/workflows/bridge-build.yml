name: bridge-build

# Compiles runtime-probe/RamusBridge.cs for real, against the actual loader
# assemblies, and publishes the DLLs. Nothing here is simulated: a failed
# compile turns this job red.

on:
  workflow_dispatch:
    inputs:
      run_map_probe:
        description: "Explicitly authorize one bounded Map runtime session"
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "runtime-probe/**"
      - ".github/workflows/bridge-build.yml"
      - ".github/scripts/build-bridge.sh"
      - ".github/scripts/build-runtime-loader-vehicle.sh"
      - ".github/scripts/fetch-loader-refs.sh"
      - "tools/compare_l2_a5a74747_28_runtime_map.py"
      - "datas/l2_a5a74747_28_loader_fallback1.json.gz"
  pull_request:
    paths:
      - "runtime-probe/**"
      - ".github/workflows/bridge-build.yml"
      - ".github/scripts/build-bridge.sh"
      - ".github/scripts/build-runtime-loader-vehicle.sh"
      - ".github/scripts/fetch-loader-refs.sh"
      - "tools/compare_l2_a5a74747_28_runtime_map.py"
      - "datas/l2_a5a74747_28_loader_fallback1.json.gz"

# NOTE: no workflow-level `concurrency` here — a reusable workflow (workflow_call)
# that also declares concurrency makes the *caller* fail with startup_failure.
# The standalone run is deduped by the job-level group instead.
permissions:
  contents: read
  pull-requests: write

env:
  BEP6_TAG: v6.0.0-pre.2
  BEP5_TAG: v5.4.23.5
  MELON_TAG: v0.7.3
  PHONE_REFS_TAG: phone-refs
  PHONE_REFS_SHA256: d5416e4e95628136fe6e49d2e9905b11fca1bba03a7bceb481801e5b85bd710f
  APK_TAG: windwings-apk-1.3.118
  APK_ASSET: windwings.xapk
  APK_SHA256: f5d3c7a188dce663a1f06961380da0d6ffa541138d7cb957215e884cdd057c7e
  APK_SIZE: "142125649"
  FUSIONCORE_TAG: "0.045"
  FUSIONCORE_COMMIT: bf4c69d9d4724e4eff058664a5be0a1d9cfd4e61
  RAMUS_PACKAGE: com.Wind.wings.Space.Shooter

jobs:
  build:
    name: compile (core + 3 loaders)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Toolchain
        run: |
          exec > >(tee -a ci.log) 2>&1
          dotnet --info | head -20
          java -version 2>&1 | head -1 || true

      - name: Fetch loader assemblies
        run: |
          exec > >(tee -a ci.log) 2>&1
          chmod +x .github/scripts/fetch-loader-refs.sh
          .github/scripts/fetch-loader-refs.sh --refs .ci/refs

      - name: Compile all targets
        id: compile
        run: |
          exec > >(tee -a ci.log) 2>&1
          set -o pipefail
          chmod +x .github/scripts/build-bridge.sh
          .github/scripts/build-bridge.sh --out dist --refs .ci/refs 2>&1 | tee -a ci.log

      - name: Keep the log
        if: always()
        run: |
          mkdir -p dist
          cp ci.log dist/ci.log 2>/dev/null || true
          wc -l ci.log 2>/dev/null || echo "no ci.log produced"

      - name: Inventory the DLLs
        if: always()
        run: |
          set -euo pipefail
          {
            echo "# Bridge build"
            echo
            find dist -name 'RamusBridge.dll' -printf '%p  %s B\n' 2>/dev/null | sort || echo "no DLL produced"
          } | tee dist/inventory.txt
          # A real plugin must at least contain the bridge types.
          for d in $(find dist -name 'RamusBridge.dll'); do
            echo "── $d"
            if command -v strings >/dev/null; then
              strings -a "$d" | grep -cE 'Ramus\.Bridge|TcpListener|RAMUSB' || true
            fi
          done

      - name: Report failure on the PR
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "<!-- bridge-build -->"
            echo "## ❌ bridge build failed"
            echo
            # The tail alone hid the compiler error: the summary is 80 lines long
            # and the CSxxxx lines sat above it. Print them first.
            echo "### compiler errors"
            echo
            echo '```'
            grep -E "error [A-Z]+[0-9]+" ci.log 2>/dev/null | sort -u | head -40 \
              || echo "(no error CS line found)"
            echo '```'
            echo
            echo "### the failing target"
            echo
            echo '```'
            grep -B 2 -A 8 "\[build\] FAIL" ci.log 2>/dev/null | head -60 || true
            echo '```'
            echo
            echo "### tail"
            echo
            echo '```'
            tail -40 ci.log 2>/dev/null || echo "no ci.log — job stopped before the first step"
            echo '```'
          } > comment.md
          chmod +x .github/scripts/pr-comment.sh
          .github/scripts/pr-comment.sh "${{ github.event.pull_request.number }}" \
            comment.md '<!-- bridge-build -->'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ramus-bridge-dlls-${{ github.run_id }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14

  build-loader-vehicle:
    name: build pinned FusionCore + RamusBridge vehicle
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Draft release assets are writer-only; this job reads the pinned asset and does not mutate it.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Verify runner Android SDK and record installed toolchain
        run: |
          set -euo pipefail
          android_sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          : "${android_sdk_root:?GitHub runner Android SDK is not configured}"
          test -d "$android_sdk_root"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "${ANDROID_HOME:-unset}" "${ANDROID_SDK_ROOT:-unset}"
          if command -v sdkmanager >/dev/null 2>&1; then
            sdkmanager --version
          else
            echo 'sdkmanager not on PATH; Gradle will use the runner-provided SDK installation.'
          fi

      - uses: gradle/actions/setup-gradle@v5

      - name: Build separate loader APK, phone-target bridge, and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OUT: ${{ runner.temp }}/runtime-loader-vehicle
        run: |
          set -euo pipefail
          chmod +x .github/scripts/build-runtime-loader-vehicle.sh
          log="$RUNNER_TEMP/runtime-loader-vehicle-build.log"
          set +e
          .github/scripts/build-runtime-loader-vehicle.sh 2>&1 | tee "$log"
          build_status=${PIPESTATUS[0]}
          set -e
          mkdir -p "$OUT"
          cp "$log" "$OUT/vehicle-build.log"
          exit "$build_status"

      - name: Summarize vehicle provenance
        if: always()
        run: |
          {
            echo '## Runtime loader vehicle build'
            echo
            if [ -f '${{ runner.temp }}/runtime-loader-vehicle/provenance.json' ]; then
              echo '```json'
              cat '${{ runner.temp }}/runtime-loader-vehicle/provenance.json'
              echo '```'
            else
              echo 'Loader/bridge build did not produce a provenance receipt.'
              tail -80 '${{ runner.temp }}/runtime-loader-vehicle/vehicle-build.log' 2>/dev/null || true
              tail -80 '${{ runner.temp }}/runtime-loader-vehicle/fusioncore-build.log' 2>/dev/null || true
              tail -80 '${{ runner.temp }}/runtime-loader-vehicle/bridge-build.log' 2>/dev/null || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish vehicle build status on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/runtime-loader-vehicle
          VEHICLE_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/runtime-loader-vehicle-status-comment.md"
          {
            if [ "$VEHICLE_JOB_STATUS" = success ]; then
              echo '## #28 CI loader vehicle build succeeded'
              echo
              echo "Pinned loader APK, phone-target bridge, and provenance are attached to [this Actions run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
              echo 'The released XAPK remains a separate, read-only source asset.'
              echo
            else
              echo '## #28 CI loader vehicle failure diagnostics'
              echo
              if [ -f "$OUT/failure.txt" ]; then
                echo '### Failed stage'
                echo
                echo '```text'
                cat "$OUT/failure.txt"
                echo '```'
                echo
              else
                echo 'The build failed before its stage receipt was written.'
                echo
              fi
              for file in vehicle-build.log loader-ref-fetch.log bridge-build.log fusioncore-build.log; do
                if [ -f "$OUT/$file" ]; then
                  echo "### Tail: $file"
                  echo
                  echo '```text'
                  tail -80 "$OUT/$file"
                  echo '```'
                  echo
                fi
              done
            fi
          } > "$body"
          chmod +x .github/scripts/pr-comment.sh
          .github/scripts/pr-comment.sh "${{ github.event.pull_request.number }}" \
            "$body" '<!-- runtime-loader-vehicle-build -->'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-loader-vehicle-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-loader-vehicle/
          if-no-files-found: warn
          retention-days: 14

  map-probe:
    name: one-shot Map arr256 depth2 receipt
    needs: build-loader-vehicle
    if: needs.build-loader-vehicle.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      pull-requests: write
    env:
      RAMUS_API_KEY: ${{ secrets.RAMUS_API_KEY }}
      RAMUS_PACKAGE: com.Wind.wings.Space.Shooter
      GH_TOKEN: ${{ github.token }}
      RUN_MAP_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_map_probe || false }}
      APK_TAG: windwings-apk-1.3.118
      APK_ASSET: windwings.xapk
      APK_SHA256: f5d3c7a188dce663a1f06961380da0d6ffa541138d7cb957215e884cdd057c7e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: runtime-loader-vehicle-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-loader-vehicle

      - name: Attempt the Map runtime readback once
        env:
          LOADER_BUNDLE: ${{ runner.temp }}/runtime-loader-vehicle
          PROBE_OUT: ${{ runner.temp }}/runtime-map-step
        run: |
          set -euo pipefail
          chmod +x runtime-probe/ci-loader-map-probe.sh
          runtime-probe/ci-loader-map-probe.sh

      - name: Add bounded report to PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report='${{ runner.temp }}/runtime-map-step/map-step-report.md'
          [ -f "$report" ] || exit 0
          cp "$report" '${{ runner.temp }}/runtime-map-step/comment.md'
          chmod +x .github/scripts/pr-comment.sh
          .github/scripts/pr-comment.sh '${{ github.event.pull_request.number }}' \
            '${{ runner.temp }}/runtime-map-step/comment.md' '<!-- runtime-loader-map -->'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-map-step-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-map-step/
          if-no-files-found: warn
          retention-days: 14
