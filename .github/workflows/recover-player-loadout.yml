name: Recover pinned player loadout native evidence
# Bản sao từ nhánh dữ liệu (commit 6ababbd31). KHÁC bản gốc ở ĐÚNG một chỗ:
# bản gốc chạy khi push vào nhánh `arena/ef6b75ef-…`, commit thẳng vào nhánh đó.
# Nhánh này KHÔNG phải nhánh dữ liệu ⇒ chỉ để `workflow_dispatch`, tránh việc push
# tài liệu lại kích hoạt job cần cache APK rồi đỏ CI một cách vô nghĩa.
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: player-loadout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/apk/windwings.xapk
          key: windwings-xapk-1.3.118-f5d3c7a188dce663a1f06961380da0d6ffa541138d7cb957215e884cdd057c7e
          fail-on-cache-miss: true
      - run: python3 -m pip install 'capstone==5.0.3'
      - name: Recover only two player loadout classes and metadata array blobs
        run: python3 tools/apk-probe/player_loadout_native.py --xapk /tmp/apk/windwings.xapk
      - name: Regression gate before publishing raw
        run: python3 -m unittest discover -s tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: player-loadout-native
          path: reverse-engineering/raw/player-loadout/
      - name: Commit scoped evidence on this session branch only
        run: |
          test "$GITHUB_REF_NAME" = 'arena/ef6b75ef-windwings-space-shooter-game-p'
          git config user.name 'Arena evidence collector'
          git config user.email 'agent@arena.ai'
          git add reverse-engineering/raw/player-loadout
          git diff --cached --quiet || git commit -m 'research(player): recover pinned ship loadout native and metadata blobs [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin arena/ef6b75ef-windwings-space-shooter-game-p
            if git push origin arena/ef6b75ef-windwings-space-shooter-game-p; then exit 0; fi
          done
          exit 1
