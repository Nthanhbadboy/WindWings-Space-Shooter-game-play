name: Verify geometry 8141386a scoped evidence
on:
  push:
    branches: ['arena/8141386a-windwings-space-shooter-game-p']
    paths:
      - 'tools/verify/geometry_8141386a*'
      - 'tools/verify/l3_geometry_8141386a*'
      - 'tests/test_geometry_8141386a*'
      - 'datas/l3_geometry*'
      - 'reverse-engineering/raw/geometry-8141386a/**'
      - 'docs/apk-analysis/*arena-8141386a*'
      - 'docs/spec/**'
      - 'docs/assets/**'
      - 'tools/verify-claims.py'
      - 'tools/refresh-readme-sizes.py'
      - '.github/workflows/verify-geometry-8141386a.yml'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-evidence:
    if: github.head_ref == 'arena/8141386a-windwings-space-shooter-game-p' || github.ref_name == 'arena/8141386a-windwings-space-shooter-game-p'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source selection and byte-backed artifact determinism
        run: |
          python3 -m tools.verify.geometry_8141386a_sources --check
          python3 -m tools.verify.l3_geometry_8141386a --check
      - name: Check original-byte font tables and bounded all-text static fallback
        run: |
          python3 -m tools.verify.geometry_8141386a_tmp_sources --check
          python3 -m tools.verify.l3_geometry_8141386a_tmp --check
          if [ ! -f reverse-engineering/raw/geometry-8141386a/scientific-ci-4.json.gz ]; then
            python3 -m tools.verify.geometry_8141386a_item_receipt --item 4 --check
          fi
      - name: Check byte-backed static atlas-map and local vertex-bounds replication
        run: |
          python3 -m tools.verify.geometry_8141386a_atlas_sources --check
          python3 -m tools.verify.l3_geometry_8141386a_atlas --check
          if [ ! -f reverse-engineering/raw/geometry-8141386a/scientific-ci-6.json.gz ]; then
            python3 -m tools.verify.geometry_8141386a_item_receipt --item 6 --check
          fi
      - name: Check exact standalone original builtin Mesh reference resolution
        run: |
          python3 -m tools.verify.geometry_8141386a_builtin_sources --check
          python3 -m tools.verify.l3_geometry_8141386a_builtin --check
          if [ ! -f reverse-engineering/raw/geometry-8141386a/scientific-ci-7.json.gz ]; then
            python3 -m tools.verify.geometry_8141386a_item_receipt --item 7 --check
          fi
      - name: Check immutable handed-off scientific snapshots (current needles checked separately)
        run: python3 -m tools.verify.geometry_8141386a_history --fetch
      - name: Geometry and support-boundary regression tests
        run: python3 -m unittest tests.test_geometry_8141386a tests.test_geometry_8141386a_tmp tests.test_geometry_8141386a_support tests.test_geometry_8141386a_atlas_binary tests.test_geometry_8141386a_atlas tests.test_geometry_8141386a_builtin_sources tests.test_geometry_8141386a_builtin -v
      - name: Current needles and explicitly scoped historical support
        run: |
          set -euo pipefail
          python3 tools/refresh-readme-sizes.py --check
          python3 tools/verify-claims.py --require APKD1,AI1,RD1 | tee /tmp/geometry-8141386a-claims.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-8141386a-scoped-claims
          path: /tmp/geometry-8141386a-claims.txt
