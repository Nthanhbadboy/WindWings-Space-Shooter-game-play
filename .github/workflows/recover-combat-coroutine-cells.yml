name: Recover two combat coroutine jump tables
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/apk/windwings.xapk
          key: windwings-xapk-1.3.118-f5d3c7a188dce663a1f06961380da0d6ffa541138d7cb957215e884cdd057c7e
          fail-on-cache-miss: true
      - run: python3 tools/recovery/combat_coroutine_cells.py --xapk /tmp/apk/windwings.xapk --output reverse-engineering/raw/combat-chain/coroutine-jump-tables.json
      - uses: actions/upload-artifact@v4
        with:
          name: combat-coroutine-jump-tables
          path: reverse-engineering/raw/combat-chain/coroutine-jump-tables.json
