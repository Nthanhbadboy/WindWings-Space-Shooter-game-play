name: Recover pinned L3 visual chains
on:
  push:
    paths: ['tools/recovery/l3_visual_chain.py', '.github/workflows/recover-l3-chain.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/apk/windwings.xapk
          key: windwings-xapk-1.3.118-f5d3c7a188dce663a1f06961380da0d6ffa541138d7cb957215e884cdd057c7e
          fail-on-cache-miss: true
      - run: python3 -m pip install 'UnityPy==1.25.4' 'TypeTreeGeneratorAPI==0.0.10' 'Pillow==12.0.0'
      - run: python3 tools/recovery/l3_visual_chain.py --xapk /tmp/apk/windwings.xapk --work /tmp/l3-chain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l3-chain-evidence
          path: reverse-engineering/raw/l3-chain
      - name: Preserve pinned graph
        run: |
          test "$GITHUB_REF_NAME" = 'arena/ef6b75ef-windwings-space-shooter-game-p'
          test -f reverse-engineering/raw/l3-chain/index.json
          git config user.name 'Arena evidence collector'
          git config user.email 'agent@arena.ai'
          git add reverse-engineering/raw/l3-chain
          git diff --cached --quiet || git commit -m 'Preserve pinned typed L3 visual graph [skip ci]'
          git pull --rebase --autostash origin arena/ef6b75ef-windwings-space-shooter-game-p
          git push origin arena/ef6b75ef-windwings-space-shooter-game-p
