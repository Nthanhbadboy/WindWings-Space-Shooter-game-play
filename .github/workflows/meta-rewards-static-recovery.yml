name: Meta rewards original static recovery
on:
  workflow_dispatch:
  push:
    branches: [arena/535b0541-windwings-space-shooter-game-p]
    paths:
      - tools/recovery/meta_rewards_native.py
      - .github/workflows/meta-rewards-static-recovery.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/535b0541-windwings-space-shooter-game-p
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install capstone==5.0.3 pyelftools==0.32
      - name: Fetch original release (static bytes only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download windwings-apk-1.3.118 --pattern windwings.xapk --dir "$RUNNER_TEMP/original"
      - name: Scoped meta reward disassembly
        run: python tools/recovery/meta_rewards_native.py --xapk "$RUNNER_TEMP/original/windwings.xapk"
      - name: Commit only own static evidence on session branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'arena/535b0541-windwings-space-shooter-game-p'
          git config user.name 'Arena static evidence collector'
          git config user.email 'agent@arena.ai'
          git add reverse-engineering/raw/meta-rewards-535b0541/native.json.gz
          if ! git diff --cached --quiet; then
            test "$(git diff --cached --numstat | wc -l)" -eq 1
            test "$(stat -c %s reverse-engineering/raw/meta-rewards-535b0541/native.json.gz)" -lt 5000000
            git commit -m 'research(meta): pin scoped original APK native bytes'
            git push origin HEAD:arena/535b0541-windwings-space-shooter-game-p
          fi
