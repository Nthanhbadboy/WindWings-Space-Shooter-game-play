name: Recover ef6b75ef controller110 evidence
on:
  push:
    paths: ['tools/recovery/controller110.py', 'tools/verify/serialized110_binary.py', '.github/workflows/recover-controller110.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: l3-controller110-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/apk/windwings.xapk
          key: windwings-xapk-1.3.118-f5d3c7a188dce663a1f06961380da0d6ffa541138d7cb957215e884cdd057c7e
          fail-on-cache-miss: true
      - run: python3 -m pip install 'UnityPy==1.25.4'
      - run: git pull --ff-only origin arena/ef6b75ef-windwings-space-shooter-game-p
      - run: python3 tools/recovery/controller110.py --xapk /tmp/apk/windwings.xapk --work /tmp/controller110
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l3-controller110-evidence
          path: reverse-engineering/raw/controller110
      - name: Preserve pinned graph
        run: |
          test "$GITHUB_REF_NAME" = 'arena/ef6b75ef-windwings-space-shooter-game-p'
          test -f reverse-engineering/raw/controller110/index.json
          git config user.name 'Arena evidence collector'
          git config user.email 'agent@arena.ai'
          git add reverse-engineering/raw/controller110
          git diff --cached --quiet || git commit -m 'Preserve pinned controller110 raw controller slices and shared schemas [skip ci]'
          git pull --rebase --autostash origin arena/ef6b75ef-windwings-space-shooter-game-p
          git push origin arena/ef6b75ef-windwings-space-shooter-game-p
